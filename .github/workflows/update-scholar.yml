name: Update Scholar stats

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 00:00 UTC
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch citation stats
        run: python scripts/update_scholar.py

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet assets/scholar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/scholar.json
            git commit -m "Update Scholar citation stats"
            git push
          else
            echo "No changes to commit"
          fi
